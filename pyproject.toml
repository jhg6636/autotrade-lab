[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autotrade-lab"
version = "0.1.0"
description = "A multi-asset research, backtesting, paper-trading, and execution laboratory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema[format]>=4.23", "numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
brokers = ["httpx>=0.27", "websockets>=12", "ccxt>=4.4"]
data = ["pyarrow>=18,<24"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrade_lab"]
